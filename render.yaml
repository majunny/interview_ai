services:
  - type: web
    name: interview-on
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEYS
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6.2-sol
      - key: INVITE_CODE
        sync: false
      - key: DATA_DIR
        value: /opt/render/project/src/storage
    disk:
      name: interview-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
