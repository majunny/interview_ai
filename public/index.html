<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="학교생활기록부 기반 대학 면접 연습과 실전 피드백" />
    <title>면접온 — 생기부 면접 코치</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <button class="brand" data-view="home" aria-label="홈으로"><span>면접</span><i>ON</i></button>
        <nav id="main-nav" aria-label="주 메뉴" hidden>
          <button data-view="home" class="nav-link active">홈</button>
          <button data-view="record" class="nav-link">생기부 분석</button>
          <button data-view="history" class="nav-link">면접 기록</button>
        </nav>
        <div class="header-actions">
          <div id="api-status" class="status-pill">연결 확인 중</div>
          <div id="account-area"></div>
        </div>
      </header>

      <main id="app" tabindex="-1"></main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
